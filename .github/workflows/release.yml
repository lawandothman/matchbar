name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Stamp version
        run: |
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Resources/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Resources/Info.plist

      - name: Build and sign
        run: |
          make app
          codesign --force --options runtime --deep --sign "Developer ID Application" WorldCupApp.app/Contents/Frameworks/Sparkle.framework
          codesign --force --options runtime --sign "Developer ID Application" WorldCupApp.app

      - name: Package as DMG
        run: |
          mkdir dist
          cp -R WorldCupApp.app dist/
          ln -s /Applications dist/Applications
          hdiutil create -volname "World Cup App" -srcfolder dist -ov -format UDZO WorldCupApp.dmg

      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_KEY" > "$KEY"
          xcrun notarytool submit WorldCupApp.dmg \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple WorldCupApp.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" WorldCupApp.dmg \
            --repo lawandothman/world-cup-app-releases \
            --title "$GITHUB_REF_NAME" --notes "World Cup App $GITHUB_REF_NAME"

      - name: Publish appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: |
          curl -sL -o /tmp/sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.7.0/Sparkle-2.7.0.tar.xz
          mkdir /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          SIG=$(echo "$SPARKLE_KEY" | /tmp/sparkle/bin/sign_update --ed-key-file - WorldCupApp.dmg)
          URL="https://github.com/lawandothman/world-cup-app-releases/releases/download/${GITHUB_REF_NAME}/WorldCupApp.dmg"
          git fetch origin main
          git checkout main
          cat > docs/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>World Cup App</title>
              <item>
                <title>${GITHUB_REF_NAME}</title>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${GITHUB_REF_NAME#v}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <pubDate>$(date -R)</pubDate>
                <enclosure url="${URL}" ${SIG} type="application/x-apple-diskimage"/>
              </item>
            </channel>
          </rss>
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "appcast ${GITHUB_REF_NAME}"
          git push origin main
